<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .node-pulse {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    .stream-line {
      stroke-dasharray: 8, 8;
      animation: dash 25s linear infinite;
    }
    .float-card-1 {
      animation: floatSlow 6s ease-in-out infinite alternate;
    }
    .float-card-2 {
      animation: floatRev 7s ease-in-out infinite alternate;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -300;
      }
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.8; transform: scale(1.02); }
    }
    @keyframes floatSlow {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes floatRev {
      0% { transform: translateY(0px); }
      100% { transform: translateY(8px); }
    }
  </style>

  <!-- Deep Canvas Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Background Decorative Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Ambient Glowing Orbs in Background -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle cx="1020" cy="260" r="160" fill="#818cf8" opacity="0.15" filter="url(#glow)" />
  <circle cx="600" cy="380" r="180" fill="#c084fc" opacity="0.1" filter="url(#glow)" />

  <!-- Dynamic Lineage Graph (Network Topology Flow in background) -->
  <g class="stream-line" opacity="0.35" stroke="#38bdf8" stroke-width="2" fill="none">
    <path d="M 80 180 C 260 90, 380 270, 560 180" />
    <path d="M 560 180 C 720 90, 880 270, 1120 180" />
    <path d="M 200 40 C 350 150, 480 80, 700 200" stroke="#818cf8" />
    <path d="M 450 320 C 650 200, 800 300, 1000 120" stroke="#c084fc" />
  </g>

  <!-- Dynamic Glowing Graph Nodes -->
  <g opacity="0.6">
    <circle cx="200" cy="140" r="5" fill="#38bdf8" filter="url(#subtleGlow)">
      <animate attributeName="r" values="4;7;4" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="380" cy="225" r="4" fill="#818cf8" />
    <circle cx="560" cy="180" r="6" fill="#38bdf8" filter="url(#subtleGlow)">
      <animate attributeName="r" values="5;8;5" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="780" cy="140" r="5" fill="#c084fc" />
    <circle cx="960" cy="220" r="6" fill="#818cf8" filter="url(#subtleGlow)">
      <animate attributeName="r" values="5;8;5" dur="3.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Floating Feature Chips / Badges on the right (Clean & Non-obstructive) -->
  <g class="float-card-1" opacity="0.9">
    <rect x="880" y="55" width="260" height="42" rx="21" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="905" cy="76" r="6" fill="#38bdf8" />
    <text x="922" y="81" class="badge-text">⚡ Automated Metadata Ingestion</text>
  </g>

  <g class="float-card-2" opacity="0.9">
    <rect x="850" y="115" width="290" height="42" rx="21" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="875" cy="136" r="6" fill="#818cf8" />
    <text x="892" y="141" class="badge-text">🔍 End-to-End Column Data Lineage</text>
  </g>

  <g class="float-card-1" opacity="0.9">
    <rect x="890" y="175" width="250" height="42" rx="21" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="915" cy="196" r="6" fill="#c084fc" />
    <text x="932" y="201" class="badge-text">🛡️ Policy, RBAC &amp; Audit Workflows</text>
  </g>

  <!-- FOREGROUND HERO CONTENT (Ensured 100% visible, high-contrast, perfectly crisp) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill -->
    <rect x="0" y="58" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <text x="16" y="79" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="0.8">DATA INTELLIGENCE &amp; GOVERNANCE</text>

    <!-- Main Title -->
    <text x="0" y="142" class="title-text" fill="url(#textGrad)">Awesome Unified Data</text>
    <text x="0" y="194" class="title-text" fill="#ffffff">&amp; Governance Catalog 🌐</text>

    <!-- Subtitle -->
    <text x="0" y="238" class="subtitle-text">
      Curated matrix of enterprise SaaS leaders &amp; open-source metadata platforms
    </text>
    <text x="0" y="265" font-family="system-ui, sans-serif" font-size="14.5" fill="#64748b" font-weight="500">
      Column-Level Lineage • Active Metadata • AI Governance • Iceberg REST • Business Glossaries
    </text>

    <!-- Feature tags below title -->
    <g transform="translate(0, 292)">
      <rect x="0" y="0" width="135" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#93c5fd">🏢 Enterprise SaaS</text>

      <rect x="145" y="0" width="145" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="159" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#a78bfa">⚡ Open-Source (OSS)</text>

      <rect x="300" y="0" width="140" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="314" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#34d399">📊 Market Dynamics</text>

      <rect x="450" y="0" width="150" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="464" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f472b6">💰 Pricing &amp; Limits</text>
    </g>
  </g>
</svg>
